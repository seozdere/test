<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>NoTik | Giriş</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="notik-rounded-192.png?v=2">
    <link rel="icon" type="image/png" sizes="512x512" href="notik-rounded-512.png?v=2">
    <link rel="shortcut icon" href="notik-rounded-192.png?v=2">
    <meta name="theme-color" content="#060A14">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NoTik">
    <link rel="apple-touch-icon" sizes="180x180" href="notik-rounded-180.png">
    <link rel="stylesheet" href="style.css?v=201">
    <style>
        body.admin-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .choice-container { background: var(--a-surface); padding: 44px 40px; border-radius: 30px; border: 1px solid var(--a-border); max-width: 480px; width: 100%; text-align: center; box-shadow: 0 32px 64px rgba(0,0,0,0.5); animation: slide-in 0.4s cubic-bezier(0.34,1.56,0.64,1); }
        .notik-brand { display:flex; align-items:center; justify-content:center; gap:16px; margin:0 auto 28px; }
        .notik-brand-logo { display:block; width:80px; height:80px; flex-shrink:0; border-radius:22px; }
        .notik-wordmark { margin:0; font-family:'Arial Rounded MT Bold','Segoe UI',sans-serif; font-size:clamp(2.5rem,9vw,3.3rem); font-weight:900; letter-spacing:-2px; line-height:1.1; padding:8px 14px; border-radius:18px; background:#F7FAFF; -webkit-text-fill-color:initial; }
        .notik-wordmark span:first-child { color:#25354C; }
        .notik-wordmark span:last-child { color:#65BD5D; }
        .school-intro { font-size: 0.8rem; color: var(--a-muted2); margin-bottom: 8px; letter-spacing: 0.5px; }
        .choice-desc  { color: var(--a-muted2); font-size: 0.88rem; margin-bottom: 36px; line-height: 1.5; }
        .choice-btn   { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 18px 24px; margin: 12px 0; border-radius: 16px; text-decoration: none; color: white; font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 1rem; transition: var(--transition); position: relative; overflow: hidden; }
        .choice-btn::after { content:''; position:absolute; inset:0; background:white; opacity:0; transition:0.2s; }
        .choice-btn:hover::after { opacity: 0.07; }
        .choice-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(0,0,0,0.35); }
        .btn-admin  { background: linear-gradient(135deg, #6366F1, #818CF8); box-shadow: 0 6px 20px rgba(99,102,241,0.35); }
        .btn-parent { background: linear-gradient(135deg, #059669, #34D399); box-shadow: 0 6px 20px rgba(16,185,129,0.3); }
        .divider    { display:flex; align-items:center; gap:12px; color:var(--a-muted); font-size:0.75rem; margin:4px 0; }
        .divider::before,.divider::after { content:''; flex:1; height:1px; background:var(--a-border2); }

    </style>
</head>
<body class="admin-page">
    <div class="choice-container">
        <div class="notik-brand"><img class="notik-brand-logo" src="notik-icon.svg" alt="NoTik" width="80" height="80"></div>
        <a href="admin.html"  class="choice-btn btn-admin"><svg class="comic-teacher" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><rect x="10" y="3" width="19" height="18" rx="3" fill="#B7E5CA" stroke="#675080" stroke-width="1.7"/><path d="M19 8h6M19 12h4M23 22v5" stroke="#675080" stroke-width="1.6" stroke-linecap="round"/><circle cx="9" cy="13" r="5" fill="#F7C49E" stroke="#675080" stroke-width="1.7"/><path d="M4 12q0-7 7-5l3 4" fill="#675080"/><path d="M2 28v-4c0-7 14-7 14 0v4Z" fill="#C4B5FD" stroke="#675080" stroke-width="1.7" stroke-linejoin="round"/><path d="m16 23 6-6" stroke="#675080" stroke-width="2" stroke-linecap="round"/></svg> Öğretmen Paneli</a>
    </div>

    <script src="pwa.js?v=4"></script>
</body>
</html>
